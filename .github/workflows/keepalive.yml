name: Keep Render Alive

on:
  schedule:
    # Every 10 minutes, 24/7 — prevents Render free-tier spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://tradepilot-xfk2.onrender.com/health || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "All attempts failed but continuing — Render may be cold-starting"
          exit 0
